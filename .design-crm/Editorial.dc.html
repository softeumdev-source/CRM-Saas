<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #4f46e5; text-decoration: none; } a:hover { color: #4338ca; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; background: #ffffff; color: #0f172a; overflow: hidden;">

  <!-- RAIL CLARO -->
  <div style="width: 68px; flex-shrink: 0; border-right: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 26px;">
    <div style="width: 32px; height: 32px; border-radius: 10px; background: #0f172a; display: flex; align-items: center; justify-content: center;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 4v16M12 4v10M19 4v6"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="width: 38px; height: 38px; border-radius: 10px; background: #f1f5f9; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>
      </div>
      <div style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
      </div>
      <div style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </div>
      <div style="width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linecap="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 8V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-3"/><path d="M3 13h8"/></svg>
      </div>
    </div>
    <div class="num" style="margin-top: auto; width: 32px; height: 32px; border-radius: 999px; background: #e0e7ff; color: #4338ca; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center;">WS</div>
  </div>

  <!-- MAIN -->
  <div style="flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 34px 0 0;">

    <div style="padding: 0 38px 26px; display: flex; align-items: flex-start; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 27px; font-weight: 500; letter-spacing: -0.028em; line-height: 1.1;">Pipeline</span>
        <span class="num" style="font-size: 14px; font-weight: 400; color: #64748b; line-height: 1.5;">25 negócios abertos, somando R$ 184.500 por mês</span>
      </div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 20px; padding-top: 5px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: #94a3b8;">Atrasados</span>
          <span class="num" style="font-size: 19px; font-weight: 500; color: #e11d48; letter-spacing: -0.02em;">3</span>
        </div>
        <div style="width: 1px; height: 34px; background: #f1f5f9;"></div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: #94a3b8;">Sem agenda</span>
          <span class="num" style="font-size: 19px; font-weight: 500; color: #d97706; letter-spacing: -0.02em;">4</span>
        </div>
        <div style="width: 1px; height: 34px; background: #f1f5f9;"></div>
        <div style="display: flex; align-items: center; gap: 8px; border: 1px solid #0f172a; border-radius: 999px; padding: 9px 17px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span style="font-size: 13px; font-weight: 500;">Novo negócio</span>
        </div>
      </div>
    </div>

    <!-- BOARD -->
    <div style="flex: 1; display: flex; gap: 30px; padding: 0 38px 30px; overflow: hidden; align-items: stretch;">
      <sc-for list="{{colunas}}" as="c" hint-placeholder-count="4">
        <div style="width: 296px; flex-shrink: 0; display: flex; flex-direction: column;">
          <div style="display: flex; align-items: baseline; gap: 9px; padding-bottom: 13px; border-bottom: 1px solid #0f172a; margin-bottom: 18px;">
            <span style="font-size: 13px; font-weight: 500; letter-spacing: -0.005em;">{{c.nome}}</span>
            <span class="num" style="font-size: 13px; font-weight: 400; color: #94a3b8;">{{c.qtd}}</span>
            <span class="num" style="margin-left: auto; font-size: 12px; font-weight: 400; color: #94a3b8;">{{c.valor}}</span>
          </div>

          <div style="flex: 1; display: flex; flex-direction: column; gap: 20px; overflow: hidden;">
            <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="2">
              <div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; border-bottom: 1px solid #f1f5f9;">
                <div style="display: flex; align-items: baseline; gap: 12px;">
                  <span style="font-size: 17px; font-weight: 500; letter-spacing: -0.022em; line-height: 1.25; flex: 1; min-width: 0;">{{k.empresa}}</span>
                  <span class="num" style="font-size: 14px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap;">{{k.valor}}</span>
                </div>
                <span style="font-size: 13.5px; font-weight: 400; color: #64748b; line-height: 1.5;">{{k.contato}}</span>
                <div style="display: flex; align-items: center; gap: 7px;">
                  <div style="width: 5px; height: 5px; border-radius: 999px; background: {{k.sinal}};"></div>
                  <span style="font-size: 12.5px; font-weight: 400; color: {{k.sinal}};">{{k.prazo}}</span>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const V = '#059669', A = '#d97706', R = '#e11d48';
    return {
      colunas: [
        { nome: 'Novo Lead / Inbound', qtd: 4, valor: 'R$ 12.400', cards: [
          { empresa: 'Distribuidora Vale Norte', contato: 'Marcos Ribeiro, Compras', valor: 'R$ 3.900', prazo: 'Contato hoje às 17:00', sinal: V },
          { empresa: 'Atacado São Bento', contato: 'Julia Prado, Diretoria', valor: 'R$ 2.800', prazo: '2 dias sem contato', sinal: A },
        ]},
        { nome: 'Qualificação', qtd: 2, valor: 'R$ 9.100', cards: [
          { empresa: 'Farmácias Bom Preço', contato: 'Aline Costa, Operações', valor: 'R$ 5.400', prazo: 'Ligar amanhã às 09:00', sinal: V },
          { empresa: 'Casa & Construção MG', contato: 'Pedro Nunes, Sócio', valor: 'R$ 3.700', prazo: 'Atrasado desde 28/08', sinal: R },
        ]},
        { nome: 'Demonstração Agendada', qtd: 5, valor: 'R$ 41.200', cards: [
          { empresa: 'Rede Supermercados Aurora', contato: 'Camila Freitas, CEO', valor: 'R$ 12.500', prazo: 'Demo hoje às 15:30', sinal: V },
          { empresa: 'Metalúrgica Trindade', contato: 'Sérgio Lima, Comercial', valor: 'R$ 8.900', prazo: 'Demo em 3 dias', sinal: V },
        ]},
        { nome: 'Proposta Enviada', qtd: 5, valor: 'R$ 68.300', cards: [
          { empresa: 'Grupo Alimentar Serra', contato: 'Diego Martins, CFO', valor: 'R$ 18.900', prazo: 'Aguardando assinatura', sinal: A },
          { empresa: 'Auto Peças Guanabara', contato: 'Tatiana Mendes, Compras', valor: 'R$ 11.200', prazo: 'Follow-up amanhã', sinal: V },
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
