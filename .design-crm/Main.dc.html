<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    body { margin: 0; font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    a { color: #4338ca; text-decoration: none; } a:hover { color: #312e81; }
    .num { font-variant-numeric: tabular-nums; }
    .serif { font-family: "Instrument Serif", Georgia, serif; }
    .card { transition: transform 160ms ease-out, box-shadow 160ms ease-out; cursor: pointer; }
    .card:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgb(28 25 23 / 0.10), 0 1px 3px rgb(28 25 23 / 0.06); }
    .card:focus-visible { outline: 2px solid #4338ca; outline-offset: 3px; }
    .nav { transition: background-color 140ms ease, color 140ms ease; cursor: pointer; }
    .nav:hover { background: #292524; color: #fafaf9; }
    .acao { transition: background-color 140ms ease, border-color 140ms ease; cursor: pointer; }
    .acao:hover { filter: brightness(0.96); }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; background: #faf9f7; color: #1c1917; overflow: hidden;">

  <!-- BARRA LATERAL -->
  <div style="width: 200px; flex-shrink: 0; background: #1c1917; display: flex; flex-direction: column; padding: 20px 12px; gap: 26px;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px;">
      <div style="width: 29px; height: 29px; border-radius: 9px; background: #4338ca; display: flex; align-items: center; justify-content: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 4v16M12 4v10M19 4v6"/></svg>
      </div>
      <span class="serif" style="color: #fafaf9; font-size: 19px; letter-spacing: -0.005em;">Softeum</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #57534e; padding: 0 10px 9px;">Comercial</div>
      <div class="nav" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; background: #292524; color: #fafaf9;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>
        <span style="font-size: 13.5px; font-weight: 500;">Pipeline</span>
      </div>
      <div class="nav" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: #d6d3d1;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
        <span style="font-size: 13.5px; font-weight: 400;">Agenda</span>
        <span class="num" style="margin-left: auto; font-size: 11px; font-weight: 600; color: #fda4af; background: #431a1f; padding: 1px 7px; border-radius: 999px;">6</span>
      </div>
      <div class="nav" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: #d6d3d1;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <span style="font-size: 13.5px; font-weight: 400;">Lista</span>
      </div>
      <div class="nav" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: #d6d3d1;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="1.9" stroke-linecap="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 8V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-3"/><path d="M3 13h8"/></svg>
        <span style="font-size: 13.5px; font-weight: 400;">Assinaturas</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #57534e; padding: 0 10px 9px;">Gestão</div>
      <div class="nav" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: #d6d3d1;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="1.9" stroke-linecap="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>
        <span style="font-size: 13.5px; font-weight: 400;">Administração</span>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 9px; background: #292524;">
      <div class="num" style="width: 27px; height: 27px; border-radius: 999px; background: #44403c; color: #e7e5e4; font-size: 10.5px; font-weight: 600; display: flex; align-items: center; justify-content: center;">WS</div>

        <span style="font-size: 12.5px; font-weight: 500; color: #fafaf9;">William</span>
        <span style="font-size: 12px; font-weight: 400; color: #a8a29e;">Vendedor</span>
      </div>
    </div>
  </div>

  <!-- CONTEUDO -->
  <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">

    <div style="padding: 24px 24px 18px; display: flex; align-items: flex-end; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="serif" style="font-size: 30px; letter-spacing: -0.012em; line-height: 1.05;">Pipeline</span>
        <span class="num" style="font-size: 13.5px; font-weight: 400; color: #78716c;">21 negócios abertos · R$ 184.500 por mês em jogo</span>
      </div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
        <div class="acao" style="display: flex; align-items: center; gap: 8px; background: #ffffff; border-radius: 10px; padding: 9px 13px; width: 250px; box-shadow: 0 1px 2px rgb(28 25 23 / 0.05);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span style="font-size: 13px; font-weight: 400; color: #a8a29e;">Buscar negócio…</span>
        </div>
        <div class="acao" tabindex="0" style="display: flex; align-items: center; gap: 8px; background: #1c1917; border-radius: 10px; padding: 10px 16px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span style="font-size: 13px; font-weight: 500; color: #fff;">Novo negócio</span>
        </div>
      </div>
    </div>

    <!-- BOARD -->
    <div style="flex: 1; display: flex; gap: 14px; padding: 0 24px 24px; overflow: hidden; align-items: stretch;">
      <sc-for list="{{colunas}}" as="c" hint-placeholder-count="5">
        <!-- a coluna tem fundo levemente mais fechado que a pagina: e o que faz
             o card branco continuar destacado num board cheio -->
        <div style="width: 262px; flex-shrink: 0; display: flex; flex-direction: column; background: #f2f0ec; border-radius: 16px; overflow: hidden;">
          <div style="padding: 15px 15px 12px; display: flex; flex-direction: column; gap: 5px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="width: 6px; height: 6px; border-radius: 999px; background: {{c.cor}};"></div>
              <span style="font-size: 13.5px; font-weight: 600; letter-spacing: -0.012em; flex: 1; min-width: 0;">{{c.nome}}</span>
              <span class="num" style="font-size: 12.5px; font-weight: 500; color: #78716c;">{{c.qtd}}</span>
            </div>
            <span class="num" style="font-size: 12.5px; font-weight: 400; color: #a8a29e; padding-left: 14px;">{{c.valor}}</span>
          </div>

          <div style="flex: 1; display: flex; flex-direction: column; gap: 9px; padding: 0 10px 10px; overflow: hidden;">
            <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="4">
              <div class="card" tabindex="0" style="background: #ffffff; border-radius: 13px; padding: 14px 15px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 1px 2px rgb(28 25 23 / 0.06);">
                <div style="display: flex; flex-direction: column; gap: 3px;">
                  <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.016em; line-height: 1.3;">{{k.empresa}}</span>
                  <span style="font-size: 12.5px; font-weight: 400; color: #78716c; line-height: 1.35;">{{k.contato}}</span>
                </div>

                <div style="display: flex; align-items: baseline; gap: 7px;">
                  <span class="num serif" style="font-size: 20px; letter-spacing: -0.008em; line-height: 1;">{{k.valor}}</span>
                  <span style="font-size: 12px; font-weight: 400; color: #a8a29e;">por mês</span>
                </div>

                <div style="display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid #f5f5f4;">
                  <span style="font-size: 12.5px; font-weight: 500; color: {{k.tom}}; flex: 1; min-width: 0;">{{k.prazo}}</span>
                  <div class="num" style="width: 21px; height: 21px; border-radius: 999px; background: #f5f5f4; color: #57534e; font-size: 9.5px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{k.dono}}</div>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
