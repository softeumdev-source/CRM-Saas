<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    *, *::before, *::after { box-sizing: border-box; }
    a { color: #4f46e5; text-decoration: none; } a:hover { color: #4338ca; }
    /* estados: nada interativo fica sem resposta ao mouse e ao teclado */
    [data-acao] { cursor: pointer; transition: background-color 140ms ease, border-color 140ms ease; }
    [data-acao]:hover { filter: brightness(0.97); }
    [data-acao]:focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
    [data-card] { cursor: pointer; transition: border-color 140ms ease, box-shadow 140ms ease; }
    [data-card]:hover { border-color: #a5b4fc; box-shadow: 0 2px 8px rgba(15,23,42,0.08); }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #f1f5f9; color: #0f172a; overflow: hidden;">

  <!-- TOP NAV (padrão atual, mantido) -->
  <div style="height: 62px; flex-shrink: 0; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 26px; gap: 22px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 31px; height: 31px; border-radius: 9px; background: #4f46e5; display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M5 4v16M12 4v10M19 4v6"/></svg>
      </div>
      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">Softeum</span>
    </div>

    <div style="display: flex; align-items: center; gap: 3px; background: #f1f5f9; border-radius: 10px; padding: 4px;">
      <span style="font-size: 13px; font-weight: 500; color: #4f46e5; background: #fff; border-radius: 7px; padding: 6px 13px; box-shadow: 0 1px 2px rgba(15,23,42,0.06);">Pipeline</span>
      <span style="font-size: 13px; font-weight: 400; color: #475569; padding: 6px 13px;">Agenda</span>
      <span style="font-size: 13px; font-weight: 400; color: #475569; padding: 6px 13px;">Lista</span>
      <span style="font-size: 13px; font-weight: 400; color: #475569; padding: 6px 13px;">Assinaturas</span>
    </div>

    <div style="margin-left: auto; display: flex; align-items: center; gap: 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <div style="display: flex; align-items: center; gap: 9px;">
        <div class="num" style="width: 30px; height: 30px; border-radius: 999px; background: #e0e7ff; color: #4338ca; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">WS</div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 13px; font-weight: 500;">William</span>
          <span style="font-size: 11.5px; font-weight: 400; color: #64748b;">Vendedor</span>
        </div>
      </div>
    </div>
  </div>

  <!-- HEADER DA PÁGINA -->
  <div style="padding: 22px 26px 16px; display: flex; align-items: flex-end; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 21px; font-weight: 600; letter-spacing: -0.02em;">Pipeline</span>
      <span class="num" style="font-size: 13px; font-weight: 400; color: #64748b;">21 negócios abertos · R$ 184.500 por mês em jogo</span>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 13px; width: 250px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span style="font-size: 13px; font-weight: 400; color: #94a3b8;">Buscar negócio…</span>
      </div>
      <div data-acao tabindex="0" style="display: flex; align-items: center; gap: 8px; background: #4f46e5; border-radius: 10px; padding: 10px 16px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span style="font-size: 13px; font-weight: 600; color: #fff;">Novo negócio</span>
      </div>
    </div>
  </div>

  <!-- BOARD -->
  <div style="flex: 1; display: flex; gap: 14px; padding: 0 26px 22px; overflow: hidden; align-items: stretch;">
    <sc-for list="{{colunas}}" as="c" hint-placeholder-count="4">
      <div style="width: 262px; flex-shrink: 0; display: flex; flex-direction: column; border-radius: 16px; border: 1px solid {{c.borda}}; background: {{c.fundo}}; overflow: hidden;">
        <div style="padding: 14px 15px 12px; display: flex; flex-direction: column; gap: 5px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 13px; font-weight: 600; letter-spacing: -0.005em; flex: 1; min-width: 0;">{{c.nome}}</span>
            <span class="num" style="font-size: 12px; font-weight: 500; color: #475569;">{{c.qtd}}</span>
          </div>
          <span class="num" style="font-size: 12px; font-weight: 400; color: #64748b;">{{c.valor}}</span>
        </div>

        <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 10px 10px; overflow: hidden;">
          <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="3">
            <div data-card tabindex="0" style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 1px 2px rgba(15,23,42,0.05);">
              <div style="display: flex; flex-direction: column; gap: 3px;">
                <span style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3;">{{k.empresa}}</span>
                <span style="font-size: 12.5px; font-weight: 400; color: #64748b; line-height: 1.4;">{{k.contato}}</span>
              </div>

              <div style="display: flex; align-items: center; gap: 7px;">
                <div style="width: 7px; height: 7px; border-radius: 999px; background: {{k.sinal}};"></div>
                <span style="font-size: 12.5px; font-weight: 400; color: #475569;">{{k.prazo}}</span>
              </div>

              <div style="display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid #f1f5f9;">
                <span class="num" style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em;">{{k.valor}}</span>
                <span style="font-size: 12px; font-weight: 400; color: #94a3b8;">/mês</span>
                <div class="num" style="margin-left: auto; width: 22px; height: 22px; border-radius: 999px; background: #e0e7ff; color: #4338ca; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{k.dono}}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

          { empresa: 'Distribuidora Vale Norte', contato: 'Marcos Ribeiro · Compras', valor: 'R$ 3.900', prazo: 'Contato hoje às 17:00', sinal: V, dono: 'WS' },

        ]},
        { nome: 'Qualificação', qtd: 2, valor: 'R$ 9.100 /mês', fundo: '#f0f9ff', borda: '#bae6fd', cards: [
          { empresa: 'Farmácias Bom Preço', contato: 'Aline Costa · Operações', valor: 'R$ 5.400', prazo: 'Ligar amanhã às 09:00', sinal: V, dono: 'WS' },
          { empresa: 'Casa & Construção MG', contato: 'Pedro Nunes · Sócio', valor: 'R$ 3.700', prazo: 'Atrasado desde 28/08', sinal: R, dono: 'WS' },

        { nome: 'Proposta Enviada', qtd: 5, valor: 'R$ 68.300 /mês', fundo: '#fffbeb', borda: '#fde68a', cards: [
          { empresa: 'Grupo Alimentar Serra', contato: 'Diego Martins · CFO', valor: 'R$ 18.900', prazo: 'Aguardando assinatura', sinal: A, dono: 'AS' },

      ],

}
</script>
</body>
</html>
